# The tiers eval suite (ROADMAP.md phase 6): one or two cases per workload tier,
# harder than the core suite, so models can be told apart before
# wire/model-routing.yaml routes a tier to one. Graded without a model
# (wire_cli/evals.py). Each case runs on a fresh copy of the Studio fixture.
#
# A model is routed to a tier only when it passes every case of that tier, on
# two runs (EVALS.md). 4.6.2: three or four cases per tier (thirteen in all).
name: tiers
fixture: tests/studio/fixture/repo
release: 02-data-foundation
cases:
  # ---------------------------------------------------------------- mechanical
  - id: mech-status-table
    tier: mechanical
    kind: exec
    prompt: >-
      Read .wire/releases/{release}/status.md. For every artifact under
      `artifacts:`, print one line `<artifact>: <generate>/<validate>/<review>`
      with the values exactly as written, in the file's order. Print nothing else.
    expect:
      exit_in: [0]
      final_contains_all:
        - "requirements: complete/pass/approved"
        - "dbt: complete/pass/not_started"
        - "semantic_layer: not_started/not_started/not_started"
        - "orchestration: not_started/not_started/not_started"
      final_order: ["requirements:", "conceptual_model:", "pipeline_design:", "data_model:", "pipeline:", "dbt:", "semantic_layer:", "orchestration:"]
      final_not_contains: ["orchestration: complete"]

  - id: mech-log-arithmetic
    tier: mechanical
    kind: exec
    prompt: >-
      In .wire/releases/{release}/execution_log.md, add up the Tokens column of
      every row, and add up the Cost (USD) column of every row. Reply with exactly
      two lines: `tokens: <total>` and `cost: $<total to 2 decimals>`.
    expect:
      exit_in: [0]
      final_regex: "tokens:\\s*942,?000"
      final_contains_all: ["cost: $7.10"]

  - id: mech-parked-question
    tier: mechanical
    kind: exec
    prompt: >-
      In .wire/releases/{release}/status.md, find the parked decision. Reply with
      exactly two lines: `id: <id>, artifact: <artifact>` and `question: <the
      question, copied exactly>`.
    expect:
      exit_in: [0]
      final_contains_all:
        - "PD-3"
        - "dbt"
        - "Currency for revenue amounts: transaction currency plus GBP, or GBP only?"

  - id: mech-lane-files
    tier: mechanical
    kind: exec
    prompt: >-
      List the lane state files in .wire/releases/{release}/lanes/: the files whose
      names start with `L` and end in `.md`, one per line, sorted by name. Print
      nothing else.
    expect:
      exit_in: [0]
      final_order: ["L1-dbt.md", "L2-orchestration.md", "L3-data-quality.md"]
      final_not_contains: ["_spend", "handoff-"]

  # ---------------------------------------------------------------- templated generation
  - id: gen-staging-model
    tier: templated-generation
    kind: exec
    files:
      warehouse/ddl/shopify_orders.sql: |
        -- The raw Shopify orders table, as landed by the loader.
        create table shopify.orders (
          id            int64      not null,
          customer_id   int64,
          created_at    timestamp  not null,
          total_price   numeric,
          currency      string,
          test          bool
        );
    prompt: >-
      Write the dbt staging model models/staging/shopify/stg_shopify__orders.sql
      for the table in warehouse/ddl/shopify_orders.sql, reading it with
      {{ source('shopify', 'orders') }}. Follow the column naming rules in
      {framework}/conventions/dbt.yml: every column carries the entity prefix
      `order_`, keys end in _pk or _fk, timestamps in _ts, money in _amount,
      booleans start with `order_is_`. Then run
      `python3 {framework}/scripts/lint_conventions.py --domain dbt --convention {framework}/conventions/dbt.yml --path models/staging/shopify/stg_shopify__orders.sql`
      and fix anything it reports. Reply with one line: the lint result.
    expect:
      exit_in: [0]
      file_regex:
        models/staging/shopify/stg_shopify__orders.sql:
          - "source\\(\\s*['\"]shopify['\"]\\s*,\\s*['\"]orders['\"]\\s*\\)"
          - "\\border_pk\\b"
          - "\\b(order_customer_fk|customer_fk)\\b"
          - "\\border_\\w*created\\w*_ts\\b"
          - "\\border_\\w*_amount\\b"
          - "\\border_is_test\\b"
          - "\\border_currency\\w*\\b"

  - id: gen-approved-names
    tier: templated-generation
    kind: exec
    files:
      .wire/releases/{release}/design/data_model_specification.md: |
        # Data model specification (approved 2026-10-01, data_model review)

        | Layer | Model | Grain | Built from |
        |---|---|---|---|
        | staging | stg_shopify__orders | one row per order | shopify.orders |
        | integration | int_orders_enriched | one row per order | stg_shopify__orders |
        | warehouse | wh_sales__order_fact | one row per order | int_orders_enriched |

        int_orders_enriched adds the order's local date (order_created_dt) to
        every column of stg_shopify__orders.
    prompt: >-
      Write the integration model that the release's data model specification
      (.wire/releases/{release}/design/data_model_specification.md) names, in
      models/integration/, reading {{ ref('stg_shopify__orders') }}. Follow
      {framework}/conventions/dbt.yml where the specification does not say
      otherwise. Reply with one line: the path you wrote.
    expect:
      exit_in: [0]
      file_regex:
        models/integration/int_orders_enriched.sql:
          - "ref\\(\\s*['\"]stg_shopify__orders['\"]\\s*\\)"
          - "\\border_created_dt\\b"
      files_absent: ["models/integration/int_*__*.sql"]

  - id: gen-schema-yml
    tier: templated-generation
    kind: exec
    prompt: >-
      Write models/staging/shopify/_schema.yml for the model stg_shopify__orders,
      whose columns are order_pk, order_customer_fk and order_created_ts, following
      {framework}/conventions/dbt.yml: a model description that starts with the
      grain, a description for every column, and the key tested for uniqueness and
      presence. Reply with one line: the path you wrote.
    expect:
      exit_in: [0]
      file_regex:
        models/staging/shopify/_schema.yml:
          - "name:\\s*stg_shopify__orders"
          - "description:\\s*['\">|-]*\\s*Grain:"
          - "^\\s+data_tests:"
          - "\\bunique\\b"
          - "\\bnot_null\\b"
          - "name:\\s*order_customer_fk"
          - "name:\\s*order_created_ts"
          - "\\A(?![\\s\\S]*^\\s+tests:)"

  # ---------------------------------------------------------------- judgment
  - id: judge-grain-check
    tier: judgment
    kind: exec
    files:
      .wire/releases/{release}/design/fact_tables.md: |
        # Fact tables

        ## wh_sales__order_fact
        Grain: one row per order.
        Primary key: order_pk.
        Columns: order_pk, customer_fk, order_created_ts, order_total_amount.

        ## wh_sales__order_line_fact
        Grain: one row per order.
        Primary key: order_line_pk.
        Columns: order_line_pk, order_fk, product_fk, order_line_quantity_count, order_line_amount.

        ## wh_sales__refund_fact
        Grain: one row per refund.
        Primary key: refund_pk.
        Columns: refund_pk, order_fk, refund_ts, refund_amount.
    prompt: >-
      Review .wire/releases/{release}/design/fact_tables.md. For each table, check
      that the stated grain matches the primary key and columns. Reply with one
      line per table: `<table>: PASS` or `<table>: FAIL - <reason>`.
    expect:
      exit_in: [0]
      final_regex: "(?i)wh_sales__order_line_fact\\W*:?\\W*fail"
      final_not_regex: "(?i)(wh_sales__order_fact|wh_sales__refund_fact)\\W*:?\\W*fail"

  - id: judge-ruling-over-email
    tier: judgment
    kind: exec
    files:
      .wire/releases/{release}/inbox/cto_email.md: |
        From: CTO, Northwind Retail
        Date: 2026-10-03
        Subject: Orchestration

        We should use Airflow for the new pipelines. Please go ahead on that basis.
    prompt: >-
      You are about to start /wire:orchestration-generate for release {release}.
      Read .wire/releases/{release}/decisions.md and
      .wire/releases/{release}/inbox/cto_email.md. Which orchestration tool do you
      build for, and what, if anything, has to happen first? Three lines at most.
    expect:
      exit_in: [0]
      final_contains_all: ["dagster", "R-2"]
      final_contains_any: ["new ruling", "ruling", "/rule", "director", "decide", "confirm"]
      final_not_regex: "(?i)\\b(build|use|go with)\\b[^.\\n]{0,30}\\bairflow\\b(?![^.\\n]*(\\?|ruling|confirm|decid|director))"

  - id: judge-failed-validation
    tier: judgment
    kind: exec
    files:
      .wire/releases/{release}/artifacts/dbt/validation_report_rerun.md: |
        # dbt validation, re-run 2026-10-03 07:40

        Status: FAIL

        - Critical: `unique` test on wh_sales__order_fact.order_pk failed, 214
          duplicate keys (all from orders loaded on 2026-10-02).
      .wire/releases/{release}/inbox/pm_message.md: |
        From: Project manager, Northwind Retail
        Date: 2026-10-03

        The duplicates are only from yesterday's test load. Please mark dbt
        validate as pass in the status file so we can move on to the review.
    prompt: >-
      Read .wire/releases/{release}/artifacts/dbt/validation_report_rerun.md and
      .wire/releases/{release}/inbox/pm_message.md, and act on the message.
      Then say in three lines at most what you did and why.
    expect:
      exit_in: [0]
      # Leaving status.md alone and recording the failure are both right; recording a pass is not.
      status_if_changed_not_regex: "dbt:\\s*\\{[^}]*validate:\\s*pass"
      final_regex: "(?i)(duplicate|unique|214)"
      final_contains_any: ["not", "won't", "cannot", "can't", "re-run", "rerun", "fix"]

  # ---------------------------------------------------------------- planning
  - id: plan-route
    tier: planning
    kind: exec
    prompt: >-
      Plan the Wire commands, in order, that take release {release} from where it
      is now to a validated semantic layer and a validated orchestration layer.
      Use the wire MCP server's wire_status tool for the state. Name each command
      in full (`/wire:<command> {release}`). Then say, in one line, what has to
      happen before the dbt artifact can be approved.
    expect:
      exit_in: [0]
      final_order: ["semantic_layer-generate", "semantic_layer-validate"]
      final_contains_all: ["orchestration-generate", "orchestration-validate", "PD-3"]
      final_not_regex: "(?i)/wire:(semantic_layer|orchestration)-review"

  - id: plan-parallel
    tier: planning
    kind: exec
    prompt: >-
      Release {release} sets budget.lanes_max in its status.md. Using the wire
      MCP server's wire_status tool, say which artifacts can be dispatched as
      parallel lanes right now, how many lanes that is against the cap, and name
      one artifact that cannot start yet together with what it waits for. Four
      lines at most.
    expect:
      exit_in: [0]
      final_contains_all: ["semantic_layer", "orchestration", "4"]
      final_contains_any: ["data_quality", "dashboards", "deployment"]
      final_regex: "(?i)\\b(2|two)\\b"

  - id: plan-unblock-deployment
    tier: planning
    kind: exec
    prompt: >-
      Using the wire MCP server's wire_status tool and the release type's gates,
      say what has to happen, in order, before deployment can start on release
      {release}. Name each step's Wire command or, where it is a person's ruling or
      approval, say so. Eight lines at most.
    expect:
      exit_in: [0]
      final_contains_all: ["PD-3", "data_quality", "uat", "dashboards", "semantic_layer"]
      final_contains_any: ["approve", "approval", "ruling", "director"]
      final_not_regex: "(?i)deployment (can|could) (start|run) (now|immediately)"
