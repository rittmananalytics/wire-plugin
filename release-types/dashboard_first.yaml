wire_schema: "1.0"
id: dashboard_first
name: "Dashboard First"
description: "Prototype-driven delivery — build dashboards on seed data first, then refactor to live client data — useful when requirements are unclear or when showing stakeholders a working prototype accelerates sign-off."
applicable_when:
  - "Client requirements are unclear and a visual prototype will accelerate alignment"
  - "Team wants to validate the data model through the BI layer before committing to ingestion"
  - "Stakeholder buy-in depends on seeing working dashboards before full build approval"

# The status.md front-matter field a release records its profile choice in, and
# what to assume when it is absent. precondition_gate.md Step 0 reads the field,
# falls back to default_profile, and STOPS if the result is not a declared
# profile id. Without both fields every dashboard_first command errored on
# resolution rather than defaulting (wire#248).
profile_field: build_profile
default_profile: seeded

profiles:
  - id: seeded
    name: "Seeded"
    description: "The canonical shape. Build everything on generated CSV seed data first, then repoint at live client sources. Use it when client data access is delayed, or when you want a dress rehearsal with no warehouse spend and a reusable CI fixture."
    # Nothing overridden — the phase list below is the seeded graph.

  - id: live_data
    name: "Live data"
    description: "Skip the seed spine. Use it when you can already query the source tables the dashboard needs. The mockup still drives the design; the build goes straight against real data."
    disable_phases:
      - seed_development
      - data_refactor
    phase_overrides:
      # With no seed_data artifact, dbt is released by the approved data model
      # instead. Everything downstream of dbt is unchanged: semantic_layer still
      # waits on dbt validate, dashboards still wait on the semantic layer.
      - id: build
        requires_phase: design
        artifacts:
          - id: dbt
            depends_on:
              - artifact: data_model
                action: review
                outcome: approved

phases:
  # Optional. Discover, define and agree what the numbers mean before design
  # bakes a definition in. Warning-level: the gate on the artifact below asks and
  # records a skip reason rather than blocking, because a hard gate on a team that
  # skips gates produces a skipped gate.
  - id: business_rules
    name: "Business Rules Discovery"
    description: "Extract and agree the business rules for the domain in scope, from legacy systems and from the people who own the definitions"
    required: false
    requires_phase: null
    artifacts:
      - id: business_rules
        command: business-rules
        required: false
        sequence: 1
        depends_on: []

  - id: requirements
    name: "Requirements"
    description: "Capture requirements with emphasis on dashboard KPIs and target audience"
    required: true
    requires_phase: null
    artifacts:
      - id: requirements
        command: requirements
        required: true
        sequence: 1
        depends_on: []
      # Optional. Runs when requirements carry [NEEDS CLARIFICATION] markers or a
      # design choice needs a stakeholder decision. It was in 3.11.9's
      # full_platform sequence and fell out of every release type when the
      # sequences became YAML (wire#248), so no release type could produce it.
      - id: workshops
        command: workshops
        required: false
        sequence: 2
        depends_on:
          - artifact: requirements
            action: review
            outcome: approved

  - id: design
    name: "Design"
    description: "Design the conceptual model, data model, dashboard mockups, and visualization catalog"
    required: true
    requires_phase: requirements
    artifacts:
      - id: conceptual_model
        command: conceptual_model
        required: true
        sequence: 1
        depends_on:
          - artifact: requirements
            action: review
            outcome: approved
          - artifact: business_rules
            action: review
            outcome: approved
            enforcement: advisory
      - id: mockups
        command: mockups
        required: true
        sequence: 2
        depends_on:
          - artifact: requirements
            action: review
            outcome: approved
      - id: viz_catalog
        command: viz_catalog
        required: true
        sequence: 3
        depends_on:
          - artifact: mockups
            action: review
            outcome: approved
      - id: data_model
        command: data_model
        required: true
        sequence: 4
        depends_on:
          - artifact: viz_catalog
            action: generate
            outcome: complete

  - id: seed_development
    name: "Seed Development"
    description: "Generate CSV seed data so the whole build runs before any client data access. Disabled by the live_data profile."
    required: true
    requires_phase: design
    artifacts:
      - id: seed_data
        command: seed_data
        required: true
        sequence: 1
        depends_on:
          - artifact: viz_catalog
            action: generate
            outcome: complete

  - id: build
    name: "Build"
    description: "dbt models, semantic layer, then the dashboards the approved mockup specifies. Same order on seed data or on live data — only the source changes."
    required: true
    requires_phase: design
    artifacts:
      - id: dbt
        command: dbt
        required: true
        sequence: 1
        depends_on:
          - artifact: seed_data
            action: review
            outcome: approved
      - id: semantic_layer
        command: semantic_layer
        required: true
        sequence: 2
        depends_on:
          - artifact: dbt
            action: validate
            outcome: PASS
      - id: dashboards
        command: dashboards
        required: true
        sequence: 3
        depends_on:
          - artifact: semantic_layer
            action: review
            outcome: approved
      - id: dbtcharts
        command: dbtcharts
        required: false
        sequence: 4
        depends_on:
          - artifact: dbt
            action: validate
            outcome: PASS
      # Optional. Publishes the release's metadata into the warehouse AGENTS
      # schema for AI agents; the semantic layer gate is advisory.
      - id: agents_schema
        command: agents_schema
        required: false
        sequence: 5
        depends_on:
          - artifact: dbt
            action: validate
            outcome: PASS
          - artifact: semantic_layer
            action: validate
            outcome: PASS
            enforcement: advisory

  - id: data_refactor
    name: "Data Refactor"
    description: "Repoint the staging layer from seeds to live client sources. Disabled by the live_data profile: there is nothing to refactor when the build was never seeded."
    required: true
    requires_phase: build
    artifacts:
      - id: data_refactor
        command: data_refactor
        required: true
        sequence: 1
        depends_on:
          - artifact: dashboards
            action: review
            outcome: approved

  - id: testing
    name: "Testing"
    description: "Data quality tests and UAT on live data"
    required: true
    # build, not data_refactor: the refactor phase is off under the live_data
    # profile, and testing depends on a finished build either way.
    requires_phase: build
    artifacts:
      - id: data_quality
        command: data_quality
        required: true
        sequence: 1
        depends_on:
          - artifact: dbt
            action: review
            outcome: approved
      - id: uat
        command: uat
        required: true
        sequence: 2
        depends_on:
          - artifact: dashboards
            action: review
            outcome: approved

  - id: deployment
    name: "Deployment"
    description: "Deploy to production and sign off"
    required: true
    requires_phase: testing
    artifacts:
      - id: deployment
        command: deployment
        required: true
        sequence: 1
        depends_on:
          - artifact: data_quality
            action: validate
            outcome: PASS
          - artifact: uat
            action: review
            outcome: approved

  # Optional. 3.11.9's dashboard_first sequence ended with training and
  # documentation; both fell out when the sequences became YAML. Optional rather
  # than required, since a rapid dashboard release does not always buy them
  # (wire#248).
  - id: enablement
    name: "Enablement"
    description: "Training and documentation for the delivered dashboards"
    required: false
    requires_phase: deployment
    artifacts:
      - id: training
        command: training
        required: false
        sequence: 1
        depends_on:
          - artifact: dashboards
            action: review
            outcome: approved
      - id: documentation
        command: documentation
        required: false
        sequence: 2
        depends_on:
          - artifact: dashboards
            action: review
            outcome: approved

