# Example schema files, without droughty. Each model subdirectory holds a
# _schema.yml (existing projects keep their existing schema file names).
# Column descriptions reference doc blocks in models/field_descriptions.md,
# so each column's meaning is written once. The test key is data_tests: on
# dbt 1.8+; a file that already uses tests: keeps tests:.
#
# Projects that use droughty do not hand-write these files: droughty
# generates models/droughty_schema.yml from the warehouse.

# ---------------------------------------------------------------------------
# models/staging/stg_back_office/_schema.yml
# ---------------------------------------------------------------------------
version: 2

models:
  - name: stg_back_office__users
    description: >
      Grain: One row per user account.
      Back-office user accounts, renamed and cast.
    columns:
      - name: user_natural_key
        description: '{{ doc("user_natural_key") }}'
        data_tests:
          - unique
          - not_null

      - name: user_account_natural_key
        description: '{{ doc("user_account_natural_key") }}'
        data_tests:
          - not_null
          - dbt_utils.at_least_one

      - name: user_name
        description: '{{ doc("user_name") }}'
        data_tests:
          - not_null
          - dbt_utils.at_least_one

      - name: user_email
        description: '{{ doc("user_email") }}'
        data_tests:
          # Null on some older accounts, so at_least_one only.
          - dbt_utils.at_least_one

      - name: user_country_code
        description: '{{ doc("user_country_code") }}'

      - name: user_account_balance_amount
        description: '{{ doc("user_account_balance_amount") }}'

      - name: user_average_session_duration_seconds
        description: '{{ doc("user_average_session_duration_seconds") }}'

      - name: user_profile_completion_ratio
        description: '{{ doc("user_profile_completion_ratio") }}'
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1

      - name: user_is_active
        description: '{{ doc("user_is_active") }}'
        data_tests:
          - not_null

      - name: user_was_deleted
        description: '{{ doc("user_was_deleted") }}'
        data_tests:
          - not_null

      - name: user_created_dt
        description: '{{ doc("user_created_dt") }}'
        data_tests:
          - not_null
          - dbt_utils.at_least_one

      - name: user_updated_ts
        description: '{{ doc("user_updated_ts") }}'
        data_tests:
          - not_null

# ---------------------------------------------------------------------------
# models/integration/int_crm/_schema.yml
# ---------------------------------------------------------------------------
  - name: int_crm__contacts
    description: >
      Grain: One row per contact email address.
      Contacts from Salesforce and HubSpot, deduplicated by email, with
      engagement fields.
    columns:
      - name: contact_natural_key
        description: '{{ doc("contact_natural_key") }}'
        data_tests:
          - not_null

      - name: contact_email
        description: '{{ doc("contact_email") }}'
        data_tests:
          - unique
          - not_null

      - name: contact_source_system
        description: '{{ doc("contact_source_system") }}'
        data_tests:
          - not_null
          - accepted_values:
              values: ['salesforce', 'hubspot']

      - name: contact_engagement_level
        description: '{{ doc("contact_engagement_level") }}'
        data_tests:
          - not_null
          - accepted_values:
              values: ['high', 'medium', 'low', 'dormant']

      - name: contact_time_since_last_activity_days
        description: '{{ doc("contact_time_since_last_activity_days") }}'
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0

# ---------------------------------------------------------------------------
# models/warehouse/wh_core/_schema.yml
# ---------------------------------------------------------------------------
  - name: wh_core__user_dim
    description: >
      Grain: One row per user.
      The user dimension: profile attributes and status for every
      back-office user account.
    columns:
      - name: user_pk
        description: '{{ doc("user_pk") }}'
        data_tests:
          - unique
          - not_null

      - name: account_fk
        description: '{{ doc("account_fk") }}'
        data_tests:
          - not_null
          - relationships:
              to: ref('wh_core__account_dim')
              field: account_pk

      - name: user_natural_key
        description: '{{ doc("user_natural_key") }}'
        data_tests:
          - not_null
          - dbt_utils.at_least_one

      - name: user_name
        description: '{{ doc("user_name") }}'

      - name: user_email
        description: '{{ doc("user_email") }}'

      - name: user_country_code
        description: '{{ doc("user_country_code") }}'

      - name: user_account_balance_amount
        description: '{{ doc("user_account_balance_amount") }}'

      - name: user_profile_completion_ratio
        description: '{{ doc("user_profile_completion_ratio") }}'

      - name: user_is_active
        description: '{{ doc("user_is_active") }}'
        data_tests:
          - not_null

      - name: user_was_deleted
        description: '{{ doc("user_was_deleted") }}'
        data_tests:
          - not_null

      - name: user_created_dt
        description: '{{ doc("user_created_dt") }}'
        data_tests:
          - not_null

      - name: user_updated_ts
        description: '{{ doc("user_updated_ts") }}'
